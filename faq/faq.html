  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "O que é o Autkids?",
        "acceptedAnswer": { "@type": "Answer", "text": "O Autkids é um aplicativo criado para apoiar crianças no desenvolvimento da comunicação, rotina e habilidades sociais por meio de atividades divertidas e interativas." }
      },
      {
        "@type": "Question",
        "name": "Para quem o aplicativo foi desenvolvido?",
        "acceptedAnswer": { "@type": "Answer", "text": "Ele foi pensado especialmente para crianças que precisam de apoio extra na comunicação e rotina - incluindo crianças autistas, mas não se limita a isso." }
      },
      {
        "@type": "Question",
        "name": "O app é gratuito?",
        "acceptedAnswer": { "@type": "Answer", "text": "Sim! Uma parte essencial é gratuita. Recursos extras podem ser desbloqueados no plano mensal ou anual." }
      },
      {
        "@type": "Question",
        "name": "Como criar uma conta?",
        "acceptedAnswer": { "@type": "Answer", "text": "Assim que o app for lançado, vai bastar baixá-lo, tocar em 'Entrar com o Google' e pronto! Em poucos segundos você já vai poder começar." }
      },
      {
        "@type": "Question",
        "name": "Quais dados do meu filho são coletados?",
        "acceptedAnswer": { "@type": "Answer", "text": "Coletamos apenas o necessário para personalizar a experiência, como progresso nas atividades e preferências de uso. Nunca vendemos ou compartilhamos dados da criança com terceiros para fins de publicidade." }
      },
      {
        "@type": "Question",
        "name": "O app é seguro para a criança usar sem supervisão constante?",
        "acceptedAnswer": { "@type": "Answer", "text": "Sim! A área da criança é livre de anúncios e de conteúdo externo, e as configurações ficam protegidas e acessíveis apenas aos responsáveis." }
      },
      {
        "@type": "Question",
        "name": "Em quais dispositivos o Autkids funciona?",
        "acceptedAnswer": { "@type": "Answer", "text": "O Autkids vai estar disponível para smartphones e tablets Android e iOS." }
      },
      {
        "@type": "Question",
        "name": "Preciso estar conectado à internet para usar o app?",
        "acceptedAnswer": { "@type": "Answer", "text": "Algumas funcionalidades exigem conexão, mas as atividades principais de comunicação podem ser usadas offline após o download inicial." }
      },
      {
        "@type": "Question",
        "name": "Como falar com o suporte?",
        "acceptedAnswer": { "@type": "Answer", "text": "Entre em contato pelo e-mail suporte@autkids.com ou pelo Instagram @autkids_." }
      },
      {
        "@type": "Question",
        "name": "Qual o horário de atendimento?",
        "acceptedAnswer": { "@type": "Answer", "text": "Nosso suporte funciona de segunda a sexta, das 8h às 18h (horário de Brasília)." }
      }
    ]
  }
