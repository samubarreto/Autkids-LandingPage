  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    /* O botão real do VLibras é renderizado dentro de um Shadow DOM
       (#vlibras-access-wrapper) com "top: calc(50vh - 20px)" embutido no
       próprio widget, o que o centraliza verticalmente e sobrepõe o
       conteúdo da página. CSS externo não alcança o Shadow DOM, então
       a correção precisa injetar um <style> diretamente dentro dele. */
    (function fixVLibrasPosition() {
      var wrapper = document.getElementById('vlibras-access-wrapper');
      if (wrapper && wrapper.shadowRoot) {
        var style = document.createElement('style');
        style.textContent = '#vlibras-access { top: auto !important; bottom: 20px !important; }';
        wrapper.shadowRoot.appendChild(style);
        return;
      }
      setTimeout(fixVLibrasPosition, 300);
    })();
  </script>
